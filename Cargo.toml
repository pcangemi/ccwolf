[package]
name = "ccwolf"
version = "0.1.0"
edition = "2024"
authors = ["Pierre CANGEMI"]
description = "Werewolf in the terminal, played by Claude models: watch Haiku, Sonnet, Opus and Fable lie to each other. Retro pixel art, French and English."
repository = "https://github.com/pcangemi/ccwolf"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude", "werewolf", "tui", "game", "llm"]
categories = ["games", "command-line-utilities"]
exclude = ["docs/", ".github/"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
